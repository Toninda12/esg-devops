

name: CI/CD - ESG DevOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '25'
          cache: maven

      - name: Compilar e executar testes
        run: bash ./mvnw --batch-mode clean verify

  publish-image:
    name: Construir e publicar imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/toninda12/esg-devops
          tags: |
            type=raw,value=latest
            type=sha

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  staging:
    name: Deploy de staging no Azure
    runs-on: ubuntu-latest
    needs: publish-image
    environment: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Publicar imagem no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: esg-devops-fitmaint
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ghcr.io/toninda12/esg-devops:latest

  production:
    name: Verificar imagem de produção
    runs-on: ubuntu-latest
    needs: staging
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Registrar imagem preparada para produção
        run: echo "Imagem publicada e disponível em ghcr.io/toninda12/esg-devops:latest"