

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: esg-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Configure ORACLE_PASSWORD no .env}
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - esg-network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esg-residuos-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-SYSTEM}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Configure SPRING_DATASOURCE_PASSWORD no .env}
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Configure APP_PASSWORD no .env}
    ports:
      - "8080:8080"
    depends_on:
      oracle:
        condition: service_healthy
    networks:
      - esg-network

volumes:
  oracle_data:

networks:
  esg-network:
    driver: bridge