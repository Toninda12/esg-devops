
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esg-devops-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/esg_devops
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - esg-network

  mongodb:
    image: mongo:8
    container_name: esg-devops-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esg-network

volumes:
  mongodb_data:

networks:
  esg-network:
    driver: bridge